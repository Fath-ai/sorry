<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff1f6">
<title>Maaf ya, Selyn 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#604e6a;background:linear-gradient(145deg,#fff0f6,#fffaf1 55%,#f0edff);overflow-x:hidden}button{font:inherit;cursor:pointer}.decor{position:fixed;inset:0;overflow:hidden;pointer-events:none}.float{position:absolute;bottom:-30px;animation:up linear infinite;opacity:.65}@keyframes up{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}main{position:relative;max-width:620px;width:calc(100% - 24px);min-height:100vh;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px 0 35px}section{width:100%;text-align:center;animation:show .45s ease}@keyframes show{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.tag{display:inline-block;padding:8px 14px;background:#fff;border:1px solid #f8d8e4;border-radius:30px;color:#b96384;font-size:.8rem;font-weight:bold}h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.12;color:#705679;margin:18px 0 12px}h1 span{color:#d85f8b}.sub{max-width:440px;margin:auto;color:#8b7b94;line-height:1.7}.kitty{font-size:100px;margin:16px auto 10px;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 5px #d8a3bb30)}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}.btn{border:0;border-radius:16px;padding:14px 22px;min-height:49px;font-weight:bold}.primary{background:linear-gradient(135deg,#ff9fbd,#ed79a0);color:#fff;box-shadow:0 6px 0 #d96691,0 12px 22px #e78aa733}.secondary{background:white;color:#ad6283;border:1px solid #f5d4e0}.btn:active{transform:translateY(3px)}.hide{display:none!important}.hint,.footer{font-size:.78rem;color:#a18fa5;margin-top:22px}.progress{width:min(100%,420px);margin:0 auto 17px;text-align:left}.pmeta{display:flex;justify-content:space-between;color:#a18fa5;font-size:.78rem;margin-bottom:8px}.track{height:8px;border-radius:20px;background:#f4e2eb;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffabc5,#c7b6ff);transition:width .35s}.card{background:#ffffffdf;border:2px solid white;border-radius:26px;padding:clamp(22px,6vw,36px);text-align:left;box-shadow:0 18px 50px #b88ca51b,inset 0 0 0 1px #f8e1eb}.icon{font-size:2.2rem;width:64px;height:64px;display:grid;place-items:center;border-radius:20px;background:#fff0f5;margin-bottom:16px}h2{font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;color:#74567d;margin:0 0 14px}.card p{font-size:1rem;line-height:1.8;color:#76677e;margin:0 0 13px}.card strong{color:#d96591}.note{background:#fff5f8;border:1px dashed #f3bfd2;border-radius:15px;padding:13px 15px;color:#a45c7c;line-height:1.65;font-size:.92rem;margin-top:18px}.dots{display:flex;justify-content:center;gap:7px;margin-top:18px}.dot{height:8px;width:8px;background:#e9dce9;border-radius:20px}.dot.active{width:24px;background:#f28aad}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:21px}.end{text-align:center}.end .icon{margin:0 auto 18px}.end p{text-align:center}.sign{color:#d96591;font-weight:bold;margin-top:20px}.confetti{position:fixed;top:-20px;animation:fall 2.7s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}@media(max-width:430px){.btn{width:100%}.actions{gap:10px}.card{border-radius:22px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><div class="decor" id="decor"></div><main>
<section id="welcome"><div class="tag">✿ surat kecil untuk Selyn ✿</div><h1>Hai, <span>Selyn...</span> 💗</h1><p class="sub">Ada sesuatu yang ingin aku sampaikan. Aku harap kamu mau meluangkan sedikit waktu untuk membacanya, ya.</p><div class="kitty">🐱💌</div><button class="btn primary" id="open">Buka suratnya, Selyn 💌</button><div class="hint">nggak perlu buru-buru bacanya ♡</div></section>
<section id="letter" class="hide" aria-live="polite"><div class="progress"><div class="pmeta"><span id="count"></span><span>pelan-pelan ya ♡</span></div><div class="track"><div class="bar" id="bar"></div></div></div><article class="card" id="card"><div id="content"></div></article><div class="dots" id="dots"></div><div class="actions"><button class="btn secondary hide" id="back">← Sebelumnya</button><button class="btn primary" id="next">Lanjut yaa 💗</button></div></section>
<div class="footer">dibuat dengan tulus, untuk Selyn ♡</div></main>
<script>
const pages=[
{icon:"💌",title:"Selyn, aku mau minta maaf.",text:["Aku benar-benar minta maaf atas apa yang terjadi. Aku tahu mungkin ada perkataan atau sikapku yang bikin kamu kecewa, sedih, atau merasa nggak nyaman.","Aku nggak mau menganggap perasaanmu sepele. Kalau aku sudah menyakiti hatimu, aku paham kalau kamu butuh waktu untuk memproses semuanya."],note:"Aku menulis ini bukan untuk memaksamu langsung memaafkan aku. Aku cuma ingin mengakui kesalahanku. 🤍"},
{icon:"🥺",title:"Aku sadar aku salah",text:["Setelah kupikirkan lagi, aku sadar aku seharusnya lebih berhati-hati dengan perkataan dan tindakanku. Mungkin saat itu aku nggak memikirkan bagaimana kamu akan merasakannya.","Apa pun alasanku, itu nggak menghapus dampak yang kamu rasakan. Aku minta maaf karena sudah membuat keadaan jadi seperti ini."],note:"Aku ingin belajar dari kesalahan ini, bukan mengulanginya lagi. 🌱"},
{icon:"🫶",title:"Kamu tetap berarti buatku",text:["Selyn, aku menghargai kamu dan pertemanan kita. Aku nggak ingin satu kesalahan membuat kamu merasa bahwa aku nggak peduli sama kamu.","Aku tahu kepercayaan dan rasa nyaman nggak bisa kembali hanya karena satu pesan. Aku ingin membuktikan lewat sikapku bahwa aku serius memperbaiki keadaan."],note:"Aku nggak berharap semuanya langsung normal. Aku berharap kita bisa pelan-pelan menemukan jalan yang baik. 🌷"},
{icon:"🌙",title:"Kamu boleh ambil waktu",text:["Kalau kamu masih marah atau kecewa, aku mengerti. Kamu nggak perlu berpura-pura baik-baik saja demi membuatku merasa lebih tenang.","Aku akan menghargai waktumu. Saat kamu siap bicara, aku akan berusaha mendengarkan dengan baik, tanpa memotong atau mencari alasan untuk membenarkan diriku."],note:"Maaf ya, Selyn. Aku ingin mendengarkan apa yang kamu rasakan, kalau suatu saat kamu bersedia cerita. 🩷"},
{icon:"🌸",title:"Sekali lagi, maaf ya, Selyn",text:["Terima kasih sudah membaca sampai sini. Aku sungguh minta maaf. Aku berharap suatu saat nanti kita bisa membicarakan ini dengan lebih tenang.","Aku nggak bisa mengubah apa yang sudah terjadi, tapi aku bisa berusaha bersikap lebih baik setelah ini. Kamu nggak harus menjawab sekarang. Aku cuma ingin kamu tahu bahwa permintaan maaf ini tulus."],note:"Semoga hati kamu segera terasa lebih ringan. Jaga diri baik-baik, ya, Selyn. 💗"}];
let i=0;const $=x=>document.getElementById(x);
function render(){let p=pages[i];$("count").textContent=`Pesan ${i+1} dari ${pages.length}`;$("bar").style.width=((i+1)/pages.length*100)+"%";$("back").classList.toggle("hide",i===0);$("next").textContent=i===pages.length-1?"Selesaikan surat 💗":"Lanjut yaa 💗";$("content").innerHTML=`<div class="icon">${p.icon}</div><h2>${p.title}</h2>${p.text.map(t=>`<p>${t}</p>`).join("")}<div class="note">${p.note}</div>`;$("dots").innerHTML=pages.map((_,n)=>`<span class="dot ${n===i?"active":""}"></span>`).join("");$("next").onclick=next}
function next(){if(i<pages.length-1){i++;render()}else ending()}
function ending(){$("count").textContent="Surat selesai dibaca";$("bar").style.width="100%";$("back").classList.add("hide");$("content").innerHTML=`<div class="end"><div class="icon">🐱</div><h2>Maaf ya, Selyn. 💗</h2><p>Aku nggak meminta kamu melupakan apa yang terjadi. Aku hanya berharap kamu bisa melihat bahwa aku sungguh menyesal dan ingin memperbaiki diri.</p><p>Kalau kamu butuh waktu, aku akan menghargainya. Kalau kamu ingin bicara, aku akan mendengarkan.</p><p><strong>Terima kasih karena pernah menjadi bagian penting dalam hariku.</strong> Aku berharap kita bisa baik-baik lagi, saat kamu sudah siap.</p><div class="sign">Dari aku, yang tulus minta maaf ♡</div></div>`;$("next").textContent="Baca lagi dari awal ↻";$("next").onclick=()=>{i=0;render()};for(let n=0;n<24;n++){let e=document.createElement("span");e.className="confetti";e.textContent=["💗","🌸","✨","🤍","💜"][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+"vw";e.style.fontSize=(14+Math.random()*14)+"px";e.style.animationDelay=Math.random()+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
$("open").onclick=()=>{$("welcome").classList.add("hide");$("letter").classList.remove("hide");i=0;render();window.scrollTo({top:0,behavior:"smooth"})};$("next").onclick=next;$("back").onclick=()=>{if(i>0){i--;render()}};
for(let n=0;n<17;n++){let e=document.createElement("span");e.className="float";e.textContent=["♡","✦","✿","💗","✨"][n%5];e.style.left=Math.random()*100+"%";e.style.fontSize=(13+Math.random()*15)+"px";e.style.animationDuration=(12+Math.random()*13)+"s";e.style.animationDelay=(-Math.random()*20)+"s";$("decor").appendChild(e)}
</script></body></html>
